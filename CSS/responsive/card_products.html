<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }
    body{
        background-color: burlywood;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .product-card{
        border-radius: 10px;
        background-color: white;
        width: 350px;
        height: 400px;
        display: flex;
        flex-direction: column;
        box-shadow: rgba(100, 100, 111, 0.2) 0px 7px 29px 0px;
    }
    .product-card img{
        margin: auto;
        border-radius: 5px;
    }
    .products-name{
        font-weight: 800;
        color: gray;
    }
</style>
<body>
    <div class="product-container">

        <div class="product-card">
            <img src="https://www.antsylabs.com/cdn/shop/articles/should-i-buy-running-shoes-online-998538.jpg?v=1659735992" alt="" class="product-img" width="300px">
            <div class="title">
                <div class="text">Sticer of white</div>
                <button>+Add Project</button>
            </div>
            <div class="products-name">NIKE</div>
            <div class="price"></div>
            <div class="product-color">
                <div class="blue"></div>
                <div class="green"></div>
                <div class="pink"></div>
            </div>
        </div>


    </div>
</body>
</html>
