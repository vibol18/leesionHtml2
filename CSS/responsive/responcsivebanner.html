<script>
    const day = document.getElementById("day")
    let result;
    switch (new Date().getDay()) {
        case 1:
            result = "MonDay"
            break;
        case 2:
            result ="Tuesday"
        break;
        case 3:
            result = "Wednesday"
        break;
        case 4:
            result ="Thursday"
        break;
        case 5:
            result = "Friday"
        break;
        case 6:
            result = "Saturday"
        break
        default:
            break;
    }
    day.innerHTML = result;
