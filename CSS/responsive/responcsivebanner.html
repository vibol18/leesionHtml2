<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0 ;
            margin: 0;
            box-sizing: border-box;
        }
        .banner{
            width: min(1250px - 32px ,100% );
            background-image:url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSwKCVgobtWPei5MDSsSMHR4dzFJ6uPcYfrGmaR0bOrR0QRKQXWbYdwcdQ&s=10 ');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            height: 470px;
            background-color: aqua;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .button{
            display: flex;
            margin-top: 370px;
        }
        .banner button{
            height: 40px;
            border-radius: 10px;
            width: 250px;
            border: none;
            font-weight: bold;
            font-size: 18px;
            color: gray;
            box-shadow: rgba(100, 100, 111, 0.2) 0px 7px 29px 0px;
        }

    </style>
</head>
<body>
    <div class="banner">
        <div class="button">
        <button>BUY NOW </button>
        </div>
    </div>
</body>
</html>
