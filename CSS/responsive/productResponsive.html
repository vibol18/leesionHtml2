    body {

        padding-top: 200px;
    }

    .content {
        border: 1px solid black;
        background-color: beige;
        width: 500px;
        height: 700px;
        display: flex;
        justify-content: center;
        border-radius: 10px;

        border-radius: 20px;
        box-shadow: 1px 4px 8px 4px;
    }

    .title {

        justify-content: space-between;
        margin-top: 30px;
    }

    .taxt {
        font-weight: 800;
        font-size: 25px;
    }

    .button {

        background-color: gray;
        color: black;
        width: 150px;
        height: 50px;
        border-radius: 20px;
        font-size: 19px;
        font-weight: 800;
        font-family: monospace;
        box-shadow: 1px 1px 6px 1px;
    }

    .name {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .color {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }

    .blue {
        background-color: black;
        height: 50px;
        width: 50px;
        border-radius: 50%;
        box-shadow: 1px 1px 6px 1px;
    }

    .green {

    .pink {
        background-color: palevioletred;
        height: 50px;
        width: 50px;
        border-radius: 50%;
        box-shadow: 1px 1px 6px 1px;
    }
    .product-container{
        display: grid;
        grid-template-columns: repeat(3,1fr);
        gap: 20px;
    }
