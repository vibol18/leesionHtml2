<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container {
        width: min(100% - 32px, 1220px);
        margin: auto;
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(3, 1fr);
    }

    .box {
        background-color: aqua;
        height: 40px;
    }

    @media screen and (max-width:576px) {
        .container{
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
    }
</style>

<body>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>

</html>
