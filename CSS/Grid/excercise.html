<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        border:  1px solid black;
        width: 500px;
        height: auto;
        display: grid;
        grid-template-columns: repeat(3,1fr);
    }
    .header{
        background-color: darkmagenta;
        grid-column: 1/4;
        height: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
    }
    .sidebar{
        grid-row: 2/4;
        background-color: aquamarine;
        height: 100px;
        width: 70px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
    }
    .fotter{
        grid-column: 1/4;
        grid-row: 4;
        height: 70px;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: aqua;
    }
</style>
<body>
    <div class="container">
        <div class="header">Header</div>
        <div class="sidebar">Side bar</div>
        <div class="content1">Content</div>
        <div class="content2">Content2</div>
        <div class="content3">Content3</div>
        <div class="fotter">Footer</div>
    </div>
</body>
</html>
