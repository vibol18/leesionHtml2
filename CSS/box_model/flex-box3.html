<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 800px;
            border: 5px solid black;
            gap: 10px;
            display: flex;
            flex-direction: column;
        }
        .header{
            background-color: aqua;
            height: 70px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
        .content{
            display: flex;
            gap: 10px;
        }
        .aside{
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 40%;
            border: 5px solid rgb(187, 16, 16);
            height: 500px;
            gap: 20px;
        }
        .hero{
            height: 40%;
            background-color: chocolate;
        }
        .side-bar{
            height: 60%;
            background-color: coral;
        }
        .page{
            border: 4px solid blueviolet;
            width: 60%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .main-content{
            background-color: yellow;
            width: 100%;
            height: 65%;
        }
        .extra-content{
            background-color: gray;
            width: 100%;
            height: 35%;
        }
        .footer{
            width: 100%;
            height: 40px;
            background-color: aquamarine;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Header</div>
        <div class="content">
            <div class="aside">
                <div class="hero"></div>
                <div class="side-bar"></div>
            </div>
            
            <div class="page">
                <div class="main-content"></div>
                <div class="extra-content"></div>
            </div>
        </div>
        <div class="footer">Footer</div>
    </div>
</body>
</html>
