        crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        :root {
            --danger: red;
            --secondary: gray;
        }

        .header {
            background-color: var(--secondary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 40px;
            font-weight: 700;
            color: whitesmoke;


            width: 100%;
        }
        .heading{
            top: 0;
            position: fixed;
            width: 100%;
        }
        .navbar {
            display: flex;

            gap: 20px;
        }

        .menu a {
            text-decoration: none;
            font-size: 30px;
            font-weight: bold;
            color: black;
            letter-spacing: -1px;
            text-transform: uppercase;
            font-family: Arial, sans-serif;
        }

        .logo img {
            height: 40px;
        }

        .icon {
            display: flex;
            gap: 25px;
            align-items: center;


        }

        .icon .cam-flag {
            width: 30px;
            height: 30px;
            border-radius: 50%;
        }

        .icon i {
            font-size: 20px;
        }

        .icon input {
            height: 30px;
            border-radius: 5px;
            width: 250px;
            border: none;
            box-shadow: 1px 1px 3px;
        }

        .container {
            margin-top: 200000px;
        }

</head>
