<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box-content {
            border: 1px solid blue;
            height: 300px;
            width: 600px;
            display: flex;
            gap: 20px;
        }
        .box1{
            background-color: blue;
            width: 70%;
            height: 100%;
        }

         .box2{
            background-color: rgb(234, 10, 111);
            width: 30%;
            height: 100%;
        }
        .box{
            background-color: aqua;
            width: 100px;
            height: 100px;
            padding-right: 100px;
            padding-left: 50px;
            padding-top: 300px;
            padding-bottom: 20px;
            margin: auto;

        }

        .box-content1{
            border: 1px solid pink;
            margin-top: 10px;
            width: 100px;
            height: 500px;
            gap: 10px;
            display: flex;
            flex-direction: column;
        }
        .box-content1 .box1{
            width: 100%;
            height: 50%;
        }
        .box-content1 .box2{
            width: 100%;
            height: 50%;
        }
    </style>
</head>

<body>
    <div class="box"></div>
    <div class="box-content">
        <div class="box1"></div>
        <div class="box2"></div>
    </div>

     <div class="box-content1">
        <div class="box1"></div>
        <div class="box2"></div>
    </div>
</body>

</html>
