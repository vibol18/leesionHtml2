<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: rgb(24, 70, 70);
        }

        .content{
            background-color: aliceblue;
            box-shadow: 5px 5px 6px;
            width: 400px;
            height: auto;
            border-radius: 10px;
        }
        .content1{
            justify-content: center;
            align-items: center;
            background-color: azure;
            border: 1px solid wheat;
            width: 350px;
            height: 450px;
            margin-top: 20px;
            margin-bottom: 20px;
            margin-left:auto;
            margin-right: auto;
            border-radius: 10px;
        }
        .image{
            justify-content: center;
            align-items: center;
            background-image: url('https://i5.walmartimages.com/seo/VEAT00L-Wireless-Earbuds-Bluetooth-5-3-Headset-Microphone-Touch-Control-IPX7-Waterproof-High-Fidelity-Stereo-Earphones-Sports-Work-66H-Playtime-Lapto_51533b6e-c49e-4459-9787-3c45d26de3ec.6ad6cf413848b8ff85c27d97aca66841.jpeg');
            background-repeat: no-repeat;
            background-size: cover;
            border: 1px solid black;
            width: 300px;
            height: 300px;
            margin-top: 20px;
            margin-bottom: 20px;
            margin-left:20px;
            margin-right: auto;
            border-radius: 10px;
        }
        .title{
            display: flex;
            color: gray;
            font-weight: 700;
            letter-spacing: 1px;
            margin-left: 20px;
        }
        p{
            display: flex;
            font-weight: bold;
            color: red;
            margin-left: 20px;
        }
        button{
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 20px;
            background-color: rgb(13, 169, 10);
            height: 30px;
            border-radius: 5px;
            font-weight: 700;
            font-family: monospace;
            border:  none;
            box-shadow: 0 0 5px  black;
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="content1">
            <div class="image"></div>
            <h3 class="title">Wireless Headphones</h3>
            <p>$59.99</p>
            <button type="">Add To Cart</button>
        </div>
    </div>
</body>
</html>
