<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .container{
            border: 1px solid black;
            margin: auto;
            height: auto;
            width: 700px;
        }
        header{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: yellow;
            font-weight: bold;
            height: 40px;
        }
        .content{
            display: flex;
            align-items: center;
        }
        .content .aside{
            width: 30%;
            display: flex;
            flex-direction: column;
            height: 400px;
        }
        .hero{
            background: green;
            width: 100%;
            height: 80px;
        }
        .sidebar{
            background-color: pink;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>Header</header>

        <div class="content">
       _     <div class="aside">
                <div class="hero">Hero</div>
                <div class="sidebar">sidebar</div>
            </div>
            <div class="left-content">
                <div class="main-content">main-content</div>
                <div class="extra-content">extra-content</div>
            </div>
        </div>
        <div class="related">
            <div class="relates-image">related_image</div>
            <div class="related-post">related-pos</div>
        </div>
        <footer>Footer</footer>
    </div>
</body>
</html>
