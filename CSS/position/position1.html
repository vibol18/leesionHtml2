<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .profile{
        width: 200px;
        height: 200px;
        border-radius: 50%;
        border: 5px solid blue;
        background-image: url('https://img.magnific.com/premium-vector/default-avatar-profile-icon-social-media-user-image-gray-avatar-icon-blank-profile-silhouette-vector-illustration_561158-3407.jpg?semt=ais_hybrid&w=740&q=80');
        background-position: center;
        background-size: cover;
        position: absolute;
    }
    .profile .profile-active{
        width: 30px;
        height: 30px;
        background-color: green;
        border-radius: 50%;
        position: relative;
        top: 160px;
        left: 150px;
    }

</style>
<body>
    <div class="profile">
        <div class="profile-active"></div>
    </div>
   
</body>
</html>
