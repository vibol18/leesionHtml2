<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .profile{
            position: absolute;
            background-color: aquamarine;
            width: 300px;
            height: 300px;
            border-radius: 50%;
        }
        .active{
            width: 50px;
            position: relative;
            height: 50px;
            border-radius: 50%;
            background-color: blue;
            border: 3px solid white;
            top: 240px;
            left: 210px;
        }

    </style>
</head>
<body>
    <div class="profile">
        <div class="active">
        </div>
    </div>
</body>
</html>
