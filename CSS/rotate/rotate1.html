<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 100px;
            height: 300px;
            border: 1px solid blue;
        }
        .box{
            width: 10px;
            background-color: aqua;
            height: 300px;
            border: 1px solid black;
            cursor: pointer;
            animation: spin infinite 1s;
            margin-left: 200px;
        }
        .box:active{
            background-color: black;

        }
        @keyframes spin {
            0%{
                background-color: aqua;
            }
            25%{
                transform: rotateZ(3600deg);
                background-color: chocolate;
            }
            50%{
                background-color: darkcyan;
                margin-left: 1500px;
                margin-top: 200px;
                height: 840px;
            }
            100%{
            }
        }
        /* body{
            animation: changbg 1s infinite;
            

        } */
        @keyframes changbg {
            0%{
                background-color: aqua;
            }
            25%{
                background-color: rgb(21, 67, 67);
            }
            50%{
                background-color: crimson;
                transform: translateY(3600deg);
            }
            75%{
                background-color: rgb(62, 161, 13);
                background-repeat: no-repeat;
                background-size: cover;
                background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSplXyT9X3-h_hxKtlIYdUlwj494FnJQYFGFTLcfJRTMg&s=10');
            }
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="box">
    </div>
    </div>
</body>
</html>
