<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 100px;
            height: 300px;
            border: 1px solid blue;
        }
        .box{
            width: 100px;
            background-color: aqua;
            height: 300px;
            border: 1px solid black;
            cursor: pointer;
        }
        .box:hover{
            transform: rotateZ(70deg);
            background-color: black;
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="box">
    </div>
    </div>
</body>
</html>
