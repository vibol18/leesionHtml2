<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }

    .navbar {
        background-color: white;
        position: fixed;
        width: 100%;
        z-index: 1000;
        display: flex;
        padding-bottom: 20px;
        padding-top: 20px;
        justify-content: space-between;
        box-shadow: 0 0 10px 5px;
    }

    .menu {
        list-style: none;
        display: flex;
        gap: 20px;
        margin-right: 100px;
        align-items: center;
    }

    .menu li a {
        font-weight: bold;
        text-transform: uppercase;
        color: black;
        text-decoration: none;
        transition: linear 3s;
    }

    .menu li a:hover {
        text-decoration: underline;
        text-decoration-color: blue;
    }

    .menu button {
        background-color: pink;
        border: none;
        width: 100px;
        height: 30px;
        border-radius: 10px;
        transition: linear 10ms;
    }

    .menu button:hover {
        box-shadow: rgba(50, 50, 93, 0.25) 0px 13px 27px -5px, rgba(0, 0, 0, 0.3) 0px 8px 16px -8px;
    }

    .name {
        font-size: 34px;
        margin-left: 20px;
        font-weight: 700;
        text-transform: uppercase;
    }

    body {
        background-color: rgb(3, 38, 3);
    }

    .container {
        padding-top: 200px;
    }

    .content {
        display: flex;
        align-items: center;
        justify-content: space-around;
    }
    .content .title{
        font-size: 50px;
        font-weight: bold;
        color: aliceblue;
    }
    .content p{
        font-size: 100px;
        color: blue;
        font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    }

    
</style>

<body>
    <nav class="navbar">
        <div class="logo">
            <div class="name">Wildore</div>
        </div>

        <ul class="menu">
            <li><a href="">Feature</a></li>
            <li><a href="">CraftSmanship</a></li>
            <li><a href="">Contact</a></li>
            <button>Order Now</button>
        </ul>
    </nav>

    <div class="container">

        <div class="content">
            <div>
                <div class="title">VG -1 Japanse Still</div>
                <p class="wildore">The Wildore</p>
                <p>Chef Knife</p>
                <div class="title-body">
                    <b>Precision forged from premium VG-10 steel. Amasterpiece of culinary craftsmanship designed for
                        those who demand perfection</b>
                </div>
            </div>


            <div class="image">
                <img src="./Z2328_zoom-removebg-preview.png" alt="">
            </div>
        </div>
    </div>
</body>

</html>
